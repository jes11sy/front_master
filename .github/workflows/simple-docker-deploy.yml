name: Simple Docker Deploy

on:
  push:
    branches: [ main, master, dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint and typecheck
      run: npm run ci:check

    # ✅ FIX #116: Hadolint для Dockerfile linting
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning

    - name: Set build environment
      run: |
        if [ "${{ github.ref_name }}" = "dev" ]; then
          echo "BUILD_API_URL=${{ secrets.DEV_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          echo "BUILD_VAPID_KEY=${{ secrets.DEV_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" >> $GITHUB_ENV
        else
          echo "BUILD_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          echo "BUILD_VAPID_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" >> $GITHUB_ENV
        fi

    - name: Build Docker image
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=${{ env.BUILD_API_URL }} \
          --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ env.BUILD_VAPID_KEY }} \
          -t mastercrm-frontend:latest .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag image
      run: |
        docker tag mastercrm-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:${{ github.ref_name }}
        docker tag mastercrm-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:${{ github.ref_name }}-${{ github.sha }}
        if [ "${{ github.ref_name }}" = "main" ]; then
          docker tag mastercrm-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:latest
        fi
        if [ "${{ github.ref_name }}" = "dev" ]; then
          docker tag mastercrm-frontend:latest ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:dev
        fi

    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:${{ github.ref_name }}
        docker push ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:${{ github.ref_name }}-${{ github.sha }}
        if [ "${{ github.ref_name }}" = "main" ]; then
          docker push ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:latest
        fi
        if [ "${{ github.ref_name }}" = "dev" ]; then
          docker push ${{ secrets.DOCKER_USERNAME }}/mastercrm-frontend:dev
        fi
